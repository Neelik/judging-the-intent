[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "judging-the-intent"
version = "0.3.1"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate==0.32.1",
    "bitsandbytes",
    "ir-datasets",
    "ir_datasets_subsample @ git+https://github.com/webis-de/ecir25-corpus-subsampling.git#subdirectory=ir_datasets_subsample",
    "datasets>=2.19.2",
    "peft==0.10.0",
    "torch==2.2.0",
    "tqdm",
    "requests",
    "faiss-gpu>=1.7.2",
    "peewee",
    "psycopg2-binary",
    "pandas>=2.3.0",
    "pyserini==0.22.0",
    "scikit-learn>=1.7.0",
    "python-terrier>=0.13.0",
    "transformers>=4.36.0",
    "protobuf>=6.32.0",
    "sentencepiece>=0.2.1",
    "onnxruntime==1.23",
#    "pyterrier_t5 @ git+https://github.com/terrierteam/pyterrier_t5.git",
#    "pyterrier_colbert @ git+https://github.com/terrierteam/pyterrier_colbert.git",
]

[dependency-groups]
dev = [
    "matplotlib>=3.10.6",
]
